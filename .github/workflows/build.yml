name: Build PerfBoost

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build arm64-v8a .so
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Package
        run: |
          mkdir -p dist/perf-boost
          cp manifest.json dist/perf-boost/
          cp build/libperf_boost.so dist/perf-boost/
          cd dist/perf-boost
          zip -r ../perf-boost.levipack manifest.json libperf_boost.so

      - uses: actions/upload-artifact@v4
        with:
          name: perf-boost
          path: |
            dist/perf-boost/
            dist/perf-boost.levipack
